name: ci

# Every PR and push to main runs this, but the tests only run when code, the
# files the tests read or this workflow changed; docs and release PRs skip
# them. The ci job always reports, so main can require it.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run for the one before it. Each push to
# main gets its own group, so none of its runs is cancelled or dropped.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE//0/}" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo code=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -qE '^(.*\.go|internal/.*|go\.(mod|sum)|minisign\.pub|docs/images/owl\.svg|install\.(sh|ps1)|\.github/workflows/ci\.yml)$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # PRs test on Linux and vet for Windows and macOS, which catches code that
  # doesn't build there. The full suite on each runs once merged to main.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - run: go test -race ./...

  # The install scripts: shellcheck, PowerShell's parser, and a real install
  # of the latest release with install.sh once the repo is public (a private
  # repo's releases need a login curl doesn't have).
  scripts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck install.sh
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - if: ${{ !github.event.repository.private }}
        run: PROWL_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh </dev/null && "$RUNNER_TEMP/bin/prowl" version

  # The TUI, agent and core tests drive fake agents and git through shell
  # scripts, which Windows can't run; the rest of the tests run here.
  windows:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./internal/gh/... ./internal/inbox/... ./internal/store/... ./internal/config/... ./internal/skill/...

  # The check main requires: it fails when a job above failed or was
  # cancelled, and passes when they passed or had nothing to test.
  ci:
    if: always()
    needs: [changes, test, scripts, windows]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
