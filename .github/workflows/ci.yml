name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # The TUI, agent and core tests drive fake agents and git through shell
  # scripts, which Windows can't run; the rest of the tests run here.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./internal/gh/... ./internal/inbox/... ./internal/store/... ./internal/config/... ./internal/skill/...

  # The AUR package as an Arch user gets it: goreleaser's PKGBUILD built by
  # makepkg from this commit's archive, linted, installed and run.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git go github-cli namcap
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
      - name: Build, lint, install and run the package
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          pkg=/home/builder/prowl-bin
          install -d -o builder "$pkg"
          cp dist/aur/prowl-bin.pkgbuild "$pkg/PKGBUILD"
          source "$pkg/PKGBUILD"
          cp dist/prowl_linux_amd64.tar.gz "$pkg/${source_x86_64[0]%%::*}"
          chown -R builder "$pkg"
          cd "$pkg"
          sudo -u builder makepkg --noconfirm
          namcap PKGBUILD prowl-bin-*.pkg.tar.zst
          pacman -U --noconfirm prowl-bin-*.pkg.tar.zst
          prowl --version
