name: ci

# Only changes that can break the build or the tests run this: code, the
# files the tests read, and this workflow. Docs and release PRs don't.
on:
  push:
    branches: [main]
    paths: &code
      - "**.go"
      - "internal/**"
      - go.mod
      - go.sum
      - minisign.pub
      - docs/images/owl.svg
      - .github/workflows/ci.yml
  pull_request:
    paths: *code

# A new push to a PR cancels the run for the one before it. Each push to
# main gets its own group, so none of its runs is cancelled or dropped.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PRs test on Linux and vet for Windows and macOS, which catches code that
  # doesn't build there. The full suite on each runs once merged to main.
  test:
    strategy:
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - run: go test -race ./...

  # The TUI, agent and core tests drive fake agents and git through shell
  # scripts, which Windows can't run; the rest of the tests run here.
  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./internal/gh/... ./internal/inbox/... ./internal/store/... ./internal/config/... ./internal/skill/...
