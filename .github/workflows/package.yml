name: package

# The AUR package as an Arch user gets it: goreleaser's PKGBUILD built by
# makepkg from this commit's archive, linted, installed and run. It runs on
# main after a code change, and on a PR that changes the packaging.
on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "internal/**"
      - go.mod
      - go.sum
      - .goreleaser.yaml
      - .github/workflows/package.yml
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/package.yml

concurrency:
  group: package-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GOCACHE: /var/cache/go/build
      GOMODCACHE: /var/cache/go/mod
    steps:
      - run: pacman -Syu --noconfirm --needed git go github-cli namcap
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/go
          key: arch-go-${{ hashFiles('go.sum') }}
          restore-keys: arch-go-
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
      - name: Build, lint, install and run the package
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          pkg=/home/builder/prowl-bin
          install -d -o builder "$pkg"
          cp dist/aur/prowl-bin.pkgbuild "$pkg/PKGBUILD"
          source "$pkg/PKGBUILD"
          cp dist/prowl_linux_amd64.tar.gz "$pkg/${source_x86_64[0]%%::*}"
          chown -R builder "$pkg"
          cd "$pkg"
          sudo -u builder makepkg --noconfirm
          namcap PKGBUILD prowl-bin-*.pkg.tar.zst
          pacman -U --noconfirm prowl-bin-*.pkg.tar.zst
          prowl --version
